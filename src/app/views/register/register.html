<div class="register-container">
    <div class="register-card">
        
        <div class="register-header">
            <h2>Registra un nuevo usuario</h2>
            <p>Ingresa los datos</p>
        </div>
        
        <form class="register-form">
            
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" class="form-control" placeholder="Ingresa el nombre">
            </div>

            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" class="form-control" placeholder="Ingresa el apellido">
            </div>

            <div class="form-group">
                <label for="edad">Edad</label>
                <input type="number" id="edad" class="form-control" placeholder="Ingresa la edad">
            </div>

            <div class="form-group">
                <label for="correo">Correo</label>
                <input type="email" id="correo" class="form-control" placeholder="correo@ejemplo.com">
            </div>

            <div class="form-group">
                <label for="genero">Género</label>
                <select id="genero" class="form-control">
                    <option value="">Selecciona...</option>
                    <option value="masculino">Masculino</option>
                    <option value="femenino">Femenino</option>
                    <option value="otro">Prefiero no decirlo</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Crear</button>

        </form>

    </div>
</div>
