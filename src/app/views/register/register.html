<div class="register-container">
    <div class="register-card">
        
        <div class="register-header">
            <h2>Registra un nuevo usuario</h2>
            <p>Ingresa los datos</p>
        </div>
        
        <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="register-form">
            
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" formControlName="nombre" class="form-control" placeholder="Ingresa el nombre">
            </div>

            <div class="form-group">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" formControlName="apellido" class="form-control" placeholder="Ingresa el apellido">
            </div>

            <div class="form-group">
                <label for="edad">Edad</label>
                <input type="number" id="edad" formControlName="edad" class="form-control" placeholder="Ingresa la edad">
            </div>

            <div class="form-group">
                <label for="correo">Correo</label>
                <input type="email" id="correo" formControlName="correo" class="form-control" placeholder="correo@ejemplo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" formControlName="password" class="form-control" placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="genero">Género</label>
                <select id="genero" formControlName="genero" class="form-control">
                    <option value="">Selecciona...</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Otro">Prefiero no decirlo</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Crear</button>

        </form>

    </div>
</div>
