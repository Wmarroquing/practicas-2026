<div class="login-container">
    <div class="login-card">

        <div class="login-header">
            <h2>Iniciar Sesión</h2>
            <p>Ingresa tus datos</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" formControlName="email" placeholder="ejemplo@correo.com" required>
                <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-text">
                    Por favor, ingresa un correo electrónico válido.
                </small>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" formControlName="password" placeholder="••••••••" required>
                <small *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
                    class="error-text">
                    La contraseña debe tener al menos 6 caracteres.
                </small>
            </div>

            <div class="form-actions-extra">
                <label class="remember-me">
                    <input type="checkbox"> Recuérdame
                </label>
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-submit">Ingresar</button>
        </form>
    </div>
</div>
